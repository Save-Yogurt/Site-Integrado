<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cadastro de Nova Carga de Transporte</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Darker+Grotesque:wght@300..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../css/Cadastro-carga.css">
    <link rel="icon" href="../assets/imgs/saveyogurt-logo.png">
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-content">
            <img src="../assets/imgs/saveyogurt-logo.png">
            <h2>Save Yogurt Admin</h2>
            <a href="dashboardGeral.html">
                <div class="menu-item">
                    <i class="fa-solid fa-chart-line" style="color: #00BCD4"></i>
                    <span class="menu-text">Dashboard Geral</span>
                </div>
            </a>

            <a href="dashboardCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-boxes-stacked" style="color: #00BCD4;"></i>
                    <span class="menu-text">Dashboard Cargas</span>
                </div>
            </a>

            <a href="cadastroLote.html">
                <div class="menu-item">
                    <i class="fa-solid fa-layer-group" style="color: #00BCD4;"></i>
                    <span class="menu-text">Cadastro Lote</span>
                </div>
            </a>

            <a href="cadastroCarga.html">
                <div class="menu-item-selected">
                    <i class="fa-solid fa-pallet" style="color: #00BCD4;"></i>
                    <span class="menu-text">Cadastro Carga</span>
                </div>
            </a>

            <a href="cadastroEntrega.html">
                <div class="menu-item">
                    <i class="fa-solid fa-truck-fast" style="color: #00BCD4;"></i>
                    <span class="menu-text">Entregas</span>
                </div>
            </a>

            <a href="statusCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-location-dot" style="color: #00BCD4;"></i>
                    <span class="menu-text">Atualizar Entrega</span>
                </div>
            </a>
        </div>
        <div class="logout-section">
            <button type="button" class="logout-btn" onclick="window.location.href='index.html'">
                Sair do Sistema
            </button>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main">

        <!-- Título da página -->
        <div class="header-pagina">
            <h1 class="header-titulo">Cadastro de Nova Carga de Transporte</h1>
        </div>

        <div class="container-principal">

            <!-- FORMULÁRIO DE CADASTRO -->
            <div class="formulario-carga">

                <h3 class="titulo-secao">Informações da Carga</h3>

                <div class="linha-inputs">
                    <div class="grupo-input">
                        <label>Código da Carga </label>
                        <input type="text" id="codigo_carga" placeholder="Ex: C001">
                    </div>
                </div>

                <div class="linha-inputs">
                    <div class="grupo-input">
                        <label>ID do Lote Associado </label>
                        <select id="id_lote">
                            <option value=""></option>
                        </select>
                    </div>
                    <div class="grupo-input">
                        <label>Produto</label>
                        <input type="text" id="produto" placeholder="">
                    </div>
                </div>

                <div class="linha-inputs">
                    <div class="grupo-input">
                        <label>**ID do Sensor Associado </label>
                        <select id="id_sensor">
                            <option value=""></option>
                        </select>
                    </div>
                    <div class="grupo-input">
                        <label>Quantidade Caixas</label>
                        <input type="number" id="qtd_caixas" placeholder="">
                    </div>
                </div>

                <div class="botoes-acao">
                    <button class="btn-cadastrar" onclick="cadastrarCarga()">
                        Cadastrar Nova Carga
                    </button>
                    <button class="btn-cancelar" onclick="cancelar()">
                        Cancelar
                    </button>
                </div>

            </div>


        </div>
        <!-- TABELAS DE INFORMAÇÕES -->
        <div class="tabelas-info">

            <!-- LOTES DISPONÍVEIS -->
            <div class="tabela-container">
                <h3 class="titulo-tabela">Lotes Disponíveis</h3>
                <div class="tabela-scroll">
                    <table class="tabela-dados">
                        <thead>
                            <tr>
                                <th>ID Lote</th>
                                <th>Cód. Lote</th>
                            </tr>
                        </thead>
                        <tbody id="tbody_lotes">

                        </tbody>
                    </table>
                </div>
            </div>

            <!-- SENSORES DISPONÍVEIS -->
            <div class="tabela-container">
                <h3 class="titulo-tabela">Sensores Disponíveis</h3>
                <div class="tabela-scroll">
                    <table class="tabela-dados">
                        <thead>
                            <tr>
                                <th>ID Sensor</th>
                                <th>Cód. Sensor</th>
                            </tr>
                        </thead>
                        <tbody id="tbody_sensores">


                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    

    <script>
        function carregarLotes() {
            var tbody = document.getElementById('tbody_lotes');
            var select = document.getElementById('id_lote');

            console.log('tbody_lotes:', tbody);   // vai mostrar null ou o elemento
            console.log('id_lote:', select);

            fetch('/cadastroCarga/lotes')
                .then(res => res.json())
                .then(lotes => {
                    console.log('lotes recebidos:', lotes);
                    tbody.innerHTML = '';
                    lotes.forEach(lote => {
                        tbody.innerHTML += `<tr><td>${lote.id_lote}</td><td>${lote.codigo_lote}</td></tr>`;
                        var option = document.createElement('option');
                        option.value = lote.id_lote;
                        option.text = lote.codigo_lote;
                        select.appendChild(option);
                    });
                });
        }

        function carregarSensores() {
            var tbody = document.getElementById('tbody_sensores');
            var select = document.getElementById('id_sensor');

            console.log('tbody_sensores:', tbody);
            console.log('id_sensor:', select);

            fetch('/cadastroCarga/sensores')
                .then(res => res.json())
                .then(sensores => {
                    console.log('sensores recebidos:', sensores);
                    tbody.innerHTML = '';
                    sensores.forEach(sensor => {
                        tbody.innerHTML += `<tr><td>${sensor.id_sensor}</td><td>${sensor.codigo_sensor}</td></tr>`;
                        var option = document.createElement('option');
                        option.value = sensor.id_sensor;
                        option.text = sensor.codigo_sensor;
                        select.appendChild(option);
                    });
                });
        }

        carregarLotes();
        carregarSensores();
        function cadastrarCarga() {
            var codigoCarga = document.getElementById('codigo_carga').value;
            var id_lote = document.getElementById('id_lote').value;
            var id_sensor = document.getElementById('id_sensor').value;
            var produto = document.getElementById('produto').value;
            var qtd_caixas = document.getElementById('qtd_caixas').value;

            // validação básica
            if (!codigoCarga || !id_lote || !id_sensor || !produto || !qtd_caixas) {
                alert('Preencha todos os campos!');
                return;
            }

            fetch('/cadastroCarga/cadastrarCarga', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    codigoCargaServer: codigoCarga,
                    id_LoteServer: id_lote,
                    id_sensorServer: id_sensor,
                    produtoServer: produto,
                    qtd_caixaServer: qtd_caixas
                })
            })
                .then(res => res.json())
                .then(function (resultado) {
                    alert('Carga cadastrada com sucesso!');
                    limparFormulario();
                    carregarLotes();    // atualiza a tabela
                    carregarSensores(); // sensor some pois virou 'Em Uso'
                })
                .catch(function (erro) {
                    console.log('Erro:', erro);
                    alert('Erro ao cadastrar carga!');
                });
        }

        function cancelar() {
            limparFormulario();
        }

        function limparFormulario() {
            document.getElementById('codigo_carga').value = '';
            document.getElementById('id_lote').value = '';
            document.getElementById('id_sensor').value = '';
            document.getElementById('produto').value = '';
            document.getElementById('qtd_caixas').value = '';
        }
    </script>
</body>

</html>
