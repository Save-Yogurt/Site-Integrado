<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Entrega</title>

    <link rel="icon" href="../assets/imgs/saveyogurt-logo.png">


    <link rel="stylesheet" href="../css/cadastro-entrega.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-content">
            <img src="../assets/imgs/saveyogurt-logo.png">
            <h2>Save Yogurt Admin</h2>
            <a href="dashboardGeral.html">
                <div class="menu-item">
                    <i class="fa-solid fa-chart-line" style="color: #00BCD4"></i>
                    <span class="menu-text">Dashboard Geral</span>
                </div>
            </a>

            <a href="dashboardCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-boxes-stacked" style="color: #00BCD4;"></i>
                    <span class="menu-text">Dashboard Cargas</span>
                </div>
            </a>

            <a href="cadastroLote.html">
                <div class="menu-item">
                    <i class="fa-solid fa-layer-group" style="color: #00BCD4;"></i>
                    <span class="menu-text">Cadastro Lote</span>
                </div>
            </a>

            <a href="cadastroCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-pallet" style="color: #00BCD4;"></i>
                    <span class="menu-text">Cadastro Carga</span>
                </div>
            </a>

            <a href="cadastroEntrega.html">
                <div class="menu-item-selected">
                    <i class="fa-solid fa-truck-fast" style="color: #00BCD4;"></i>
                    <span class="menu-text">Entregas</span>
                </div>
            </a>

            <a href="statusCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-location-dot" style="color: #00BCD4;"></i>
                    <span class="menu-text">Atualizar Entrega</span>
                </div>
            </a>
        </div>
        <div class="logout-section">
            <button type="button" class="logout-btn" onclick="window.location.href='index.html'">
                Sair do Sistema
            </button>
        </div>
    </div>

    <!-- MAIN -->
    <main>

        <!-- TÍTULO -->
        <div id="bloco_titulo">

            <h1>Cadastro de Nova Entrega</h1>

        </div>

        <!-- CONTAINER -->
        <div id="container_entrega">

            <!-- FORM -->
            <div id="bloco_formulario">

                <h3 class="titulo_secao">
                    Informações da Entrega
                </h3>

                <div class="grupo_input">

                    <label>Placa do Veículo</label>

                    <input type="text" placeholder="Ex: ABC-1234">

                </div>

                <div class="grupo_input">

                    <label>Destino</label>

                    <input type="text" placeholder="Ex: São Paulo - SP">

                </div>

                <div class="grupo_input">

                    <label>Tipo de Veículo</label>

                    <input type="text" placeholder="ex: carreta, caminhão ">


                </div>

                <!-- BOTÕES -->
                <div id="grupo_botoes">

                    <button class="botao" onclick="cadastrarEntrega()">
                        Cadastrar Nova Entrega
                    </button>

                    <button class="botao_cancelar">
                        Cancelar
                    </button>

                </div>

            </div>

            <!-- TABELA -->
            <div id="bloco_tabela">

                <h3 class="titulo_secao">
                    Cargas Sem Entrega Vinculada
                </h3>

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Lote</th>
                            <th>Sensor</th>
                            <th>Temp. Min</th>
                            <th>Temp. Max</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>301</td>
                            <td>A123</td>
                            <td>S1</td>
                            <td>2°C</td>
                            <td>8°C</td>

                        </tr>

                        <tr>

                            <td>302</td>
                            <td>B456</td>
                            <td>S2</td>
                            <td>1°C</td>
                            <td>7°C</td>

                        </tr>

                        <tr>

                            <td>303</td>
                            <td>C789</td>
                            <td>S3</td>
                            <td>3°C</td>
                            <td>9°C</td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

    <!-- FOOTER -->

    <script src="../js/cadastro-entrega.js"></script>
</body>

</html>

<script>
    let cargasSelecionadas = [];

window.onload = () => {
    listarCargas();
};

function listarCargas() {

    fetch("/entrega/listarSemEntrega")
    .then(res => res.json())
    .then(dados => {

        const tbody = document.querySelector("tbody");

        tbody.innerHTML = "";

        dados.forEach((carga) => {

            tbody.innerHTML += `
                <tr onclick="selecionarCarga(${carga.id_carga}, this)">
                    <td>${carga.id_carga}</td>
                    <td>${carga.codigo_lote}</td>
                    <td>${carga.codigo_sensor}</td>
                    <td>${carga.temp_min}°C</td>
                    <td>${carga.temp_max}°C</td>
                </tr>
            `;
        });

    })
    .catch((erro) => {
        console.log("Erro ao listar cargas:", erro);
    });
}

function selecionarCarga(idCarga, linha) {

    if (cargasSelecionadas.includes(idCarga)) {

        cargasSelecionadas =
            cargasSelecionadas.filter(id => id != idCarga);

        linha.style.backgroundColor = "";

    } else {

        cargasSelecionadas.push(idCarga);

        linha.style.backgroundColor = "#d1f5ff";
    }
}

function cadastrarEntrega() {

    const inputs = document.querySelectorAll("input");

    const placa = inputs[0].value;
    const destino = inputs[1].value;
    const tipoVeiculo = inputs[2].value;

    if (
        placa == "" ||
        destino == "" ||
        tipoVeiculo == ""
    ) {
        alert("Preencha todos os campos");
        return;
    }

    if (cargasSelecionadas.length == 0) {
        alert("Selecione ao menos uma carga");
        return;
    }

    fetch("/entrega/cadastrar", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            placa,
            destino,
            tipoVeiculo,
            cargas: cargasSelecionadas
        })

    })
    .then(res => res.json())
    .then(resposta => {

        alert(resposta.mensagem);

        window.location.reload();
    })
    .catch((erro) => {

        console.log("Erro ao cadastrar entrega:", erro);
    });
}
</script>
