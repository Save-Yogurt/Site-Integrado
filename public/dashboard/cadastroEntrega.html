<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Entrega</title>

    <link rel="icon" href="../assets/imgs/saveyogurt-logo.png">


    <link rel="stylesheet" href="../css/cadastro-entrega.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-content">
            <img src="../assets/imgs/saveyogurt-logo.png">
            <h2>Save Yogurt Admin</h2>
            <a href="dashboardGeral.html">
                <div class="menu-item">
                    <i class="fa-solid fa-chart-line" style="color: #00BCD4"></i>
                    <span class="menu-text">Dashboard Geral</span>
                </div>
            </a>

            <a href="dashboardCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-boxes-stacked" style="color: #00BCD4;"></i>
                    <span class="menu-text">Dashboard Cargas</span>
                </div>
            </a>

            <a href="cadastroLote.html">
                <div class="menu-item">
                    <i class="fa-solid fa-layer-group" style="color: #00BCD4;"></i>
                    <span class="menu-text">Cadastro Lote</span>
                </div>
            </a>

            <a href="cadastroCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-pallet" style="color: #00BCD4;"></i>
                    <span class="menu-text">Cadastro Carga</span>
                </div>
            </a>

            <a href="cadastroEntrega.html">
                <div class="menu-item-selected">
                    <i class="fa-solid fa-truck-fast" style="color: #00BCD4;"></i>
                    <span class="menu-text">Entregas</span>
                </div>
            </a>

            <a href="statusCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-location-dot" style="color: #00BCD4;"></i>
                    <span class="menu-text">Atualizar Entrega</span>
                </div>
            </a>
        </div>
        <div class="logout-section">
            <button type="button" class="logout-btn" onclick="window.location.href='index.html'">
                Sair do Sistema
            </button>
        </div>
    </div>

    <!-- MAIN -->
    <main>

        <!-- TÍTULO -->
        <div id="bloco_titulo">

            <h1>Cadastro de Nova Entrega</h1>

        </div>

        <!-- CONTAINER -->
        <div id="container_entrega">

            <!-- FORM -->
            <div id="bloco_formulario">

                <h3 class="titulo_secao">
                    Informações da Entrega
                </h3>
                <div class="grupo_input">

                    <label>Selecionar id da Carga</label>

                    <select id="select_carga">

                        <option value="">Selecione uma carga</option>

                    </select>

                </div>
                <div class="grupo_input">

                    <label>Placa do Veículo</label>

                    <input type="text" placeholder="Ex: ABC-1234">

                </div>

                <div class="grupo_input">

                    <label>Destino</label>

                    <input type="text" placeholder="Ex: São Paulo - SP">

                </div>

                <div class="grupo_input">

                    <label>Tipo de Veículo</label>

                    <input type="text" placeholder="ex: carreta, caminhão ">


                </div>

                <!-- BOTÕES -->
                <div id="grupo_botoes">

                    <button class="botao" onclick="cadastrarEntrega()">
                        Cadastrar Nova Entrega
                    </button>

                    <button class="botao_cancelar">
                        Cancelar
                    </button>

                </div>

            </div>

            <!-- TABELA -->
            <div id="bloco_tabela">

                <h3 class="titulo_secao">
                    Cargas Sem Entrega Vinculada
                </h3>

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Código da Carga</th>

                        </tr>

                    </thead>

                    <tbody id="tbody_cargas">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

    <!-- FOOTER -->

    
</body>

</html>

<script>
    window.onload = () => {

        listarCargas();
    };

    function listarCargas() {

        fetch("/entrega/listarSemEntrega")

            .then(function (resposta) {

                return resposta.json();
            })

            .then(function (dados) {

                var tbody =
                    document.getElementById("tbody_cargas");

                var select =
                    document.getElementById("select_carga");

                tbody.innerHTML = "";

                select.innerHTML = `
            <option value="">
                Selecione uma carga
            </option>
        `;

                for (var i = 0; i < dados.length; i++) {

                    tbody.innerHTML += `
                <tr>
                    <td>${dados[i].id_carga}</td>
                    <td>${dados[i].codigo_Carga}</td>
                </tr>
            `;

                    select.innerHTML += `
                <option value="${dados[i].id_carga}">
                    ${dados[i].codigo_Carga}
                </option>
            `;
                }

            })

            .catch(function (erro) {

                console.log("Erro ao listar cargas", erro);
            });
    }

    function cadastrarEntrega() {

        var inputs =
            document.querySelectorAll("input");

        var placa = inputs[0].value;
        var destino = inputs[1].value;
        var tipoVeiculo = inputs[2].value;

        var idCarga =
            document.getElementById("select_carga").value;

        if (
            placa == "" ||
            destino == "" ||
            tipoVeiculo == "" ||
            idCarga == ""
        ) {

            alert("Preencha todos os campos");
            return;
        }

        fetch("/entrega/cadastrar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                placa: placa,
                destino: destino,
                tipoVeiculo: tipoVeiculo,
                cargas: [idCarga]
            })

        })

            .then(function (resposta) {

                return resposta.json();
            })

            .then(function (dados) {

                alert(dados.mensagem);

                window.location.reload();
            })

            .catch(function (erro) {

                console.log("Erro ao cadastrar", erro);
            });
    }
</script>
