<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Entrega</title>

    <link rel="icon" href="../assets/imgs/saveyogurt-logo.png">

    <link rel="stylesheet" href="../css/cadastro-entrega.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-content">
            <img src="../assets/imgs/saveyogurt-logo.png">
            <h2>Save Yogurt Admin</h2>

            <a href="dashboardGeral.html">
                <div class="menu-item">
                    <i class="fa-solid fa-chart-line" style="color: #00BCD4"></i>
                    <span class="menu-text">Dashboard Geral</span>
                </div>
            </a>

            <a href="dashboardCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-boxes-stacked" style="color: #00BCD4;"></i>
                    <span class="menu-text">Dashboard Cargas</span>
                </div>
            </a>

            <a href="cadastroLote.html">
                <div class="menu-item">
                    <i class="fa-solid fa-layer-group" style="color: #00BCD4;"></i>
                    <span class="menu-text">Cadastro Lote</span>
                </div>
            </a>

            <a href="cadastroCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-pallet" style="color: #00BCD4;"></i>
                    <span class="menu-text">Cadastro Carga</span>
                </div>
            </a>

            <a href="cadastroEntrega.html">
                <div class="menu-item-selected">
                    <i class="fa-solid fa-truck-fast" style="color: #00BCD4;"></i>
                    <span class="menu-text">Entregas</span>
                </div>
            </a>

            <a href="statusCarga.html">
                <div class="menu-item">
                    <i class="fa-solid fa-location-dot" style="color: #00BCD4;"></i>
                    <span class="menu-text">Atualizar Entrega</span>
                </div>
            </a>

            
        </div>

        <div class="logout-section">
            <button type="button" class="logout-btn" onclick="window.location.href='index.html'">
                Sair do Sistema
            </button>
        </div>
    </div>

    <!-- MAIN -->
    <main>

        <!-- TÍTULO -->
        <div id="bloco_titulo">
            <h1>Cadastro de Nova Entrega</h1>
        </div>

        <!-- CONTAINER -->
        <div id="container_entrega">

            <!-- FORM -->
            <div id="bloco_formulario">

                <h3 class="titulo_secao">
                    Informações da Entrega
                </h3>

                <div class="grupo_input">
                    <label>Código da Carga</label>
                    <input type="text" id="ipt_codigo_carga" placeholder="Ex: C002">
                </div>

                <div class="grupo_input">
                    <label>Placa do Veículo</label>
                    <input type="text" id="ipt_placa" placeholder="Ex: ABC1D23">
                </div>

                <div class="grupo_input">
                    <label>Destino</label>
                    <input type="text" id="ipt_destino" placeholder="Ex: São Paulo - SP">
                </div>

                <div class="grupo_input">
                    <label>Tipo de Veículo</label>

                    <select name="transporte" id="ipt_tipo_veiculo">
                        <option value="">Selecione...</option>
                        <option value="caminhao_refrigerado">Caminhão refrigerado</option>
                        <option value="caminhao_frigorifico">Caminhão frigorífico</option>
                        <option value="carreta_refrigerada">Carreta refrigerada</option>
                        <option value="van_refrigerada">Van refrigerada</option>
                        <option value="fiorino_refrigerada">Fiorino refrigerada</option>
                        <option value="navio">Navio</option>
                        <option value="balsa">Balsa</option>
                        <option value="trem">Trem</option>
                        <option value="aviao">Avião</option>
                        <option value="helicoptero">Helicóptero</option>
                    </select>
                </div>

                <div id="grupo_botoes">

                    <button type="button" class="botao" onclick="cadastrarEntrega()">
                        Cadastrar Nova Entrega
                    </button>

                    <button type="button" class="botao_cancelar" onclick="limparCampos()">
                        Cancelar
                    </button>

                </div>

            </div>

            <!-- TABELA -->
            <div id="bloco_tabela">

                <h3 class="titulo_secao">
                    Cargas Sem Entrega Vinculada
                </h3>

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código da Carga</th>
                        </tr>
                    </thead>

                    <tbody id="tbody_cargas">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</body>

</html>

<script>
    window.onload = () => {
        listarCargas();
    };

    function listarCargas() {
        fetch("/entrega/listarSemEntrega")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {
                var tbody = document.getElementById("tbody_cargas");
                tbody.innerHTML = "";

                for (var i = 0; i < dados.length; i++) {
                    tbody.innerHTML += `
                        <tr>
                            <td>${dados[i].id_carga}</td>
                            <td>${dados[i].codigo_Carga}</td>
                        </tr>
                    `;
                }
            })
            .catch(function (erro) {
                console.log("Erro ao listar cargas", erro);
            });
    }

    function cadastrarEntrega() {
        var placa = document.getElementById("ipt_placa").value.trim();
        var destino = document.getElementById("ipt_destino").value.trim();
        var tipoVeiculo = document.getElementById("ipt_tipo_veiculo").value;
        var codigo_Carga = document.getElementById("ipt_codigo_carga").value.trim();

        if (
            placa == "" ||
            destino == "" ||
            tipoVeiculo == "" ||
            codigo_Carga == ""
        ) {
            alert("Preencha todos os campos");
            return;
        }

        fetch("/entrega/cadastrar", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                placa: placa,
                destino: destino,
                tipoVeiculo: tipoVeiculo,
                cargas: codigo_Carga
            })
        })
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {
                alert(dados.mensagem);
                window.location.reload();
            })
            .catch(function (erro) {
                console.log("Erro ao cadastrar", erro);
            });
    }

    function limparCampos() {
        document.getElementById("ipt_codigo_carga").value = "";
        document.getElementById("ipt_placa").value = "";
        document.getElementById("ipt_destino").value = "";
        document.getElementById("ipt_tipo_veiculo").value = "";
    }
</script>
