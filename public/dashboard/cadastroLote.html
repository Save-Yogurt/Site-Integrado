<!DOCTYPE html>
<link rel="icon" href="/public/assets/imgs/saveyogurt-logo.png">
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cadastro de Lotes</title>

    <!-- Link Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Darker+Grotesque:wght@300..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

    <!-- Link FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../css/cadastro_do_lote.css">

</head>

    <body onload="validarSessao()">

        <div class="sidebar">
            <div class="sidebar-content">
                <img src="../assets/imgs/saveyogurt-logo.png">
                <h2>Save Yogurt Admin</h2>
                <a href="dashboardGeral.html">
                    <div class="menu-item">
                        <i class="fa-solid fa-chart-line" style="color: #00BCD4"></i>
                        <span class="menu-text">Dashboard Geral</span>
                    </div>
                </a>

                <a href="dashboardCarga.html">
                    <div class="menu-item">
                        <i class="fa-solid fa-boxes-stacked" style="color: #00BCD4;"></i>
                        <span class="menu-text">Dashboard Cargas</span>
                    </div>
                </a>

                <a href="cadastroLote.html">
                    <div class="menu-item-selected">
                        <i class="fa-solid fa-layer-group" style="color: #00BCD4;"></i>
                        <span class="menu-text">Cadastro Lote</span>
                    </div>
                </a>

                <a href="cadastroCarga.html">
                    <div class="menu-item">
                        <i class="fa-solid fa-pallet" style="color: #00BCD4;"></i>
                        <span class="menu-text">Cadastro Carga</span>
                    </div>
                </a>

                <a href="cadastroEntrega.html">
                    <div class="menu-item">
                        <i class="fa-solid fa-truck-fast" style="color: #00BCD4;"></i>
                        <span class="menu-text">Entregas</span>
                    </div>
                </a>

                <a href="statusCarga.html">
                    <div class="menu-item">
                        <i class="fa-solid fa-location-dot" style="color: #00BCD4;"></i>
                        <span class="menu-text">Atualizar Entrega</span>
                    </div>
                </a>
            </div>
            <div class="logout-section">
                <button type="button" class="logout-btn" onclick="window.location.href='index.html'">
                    Sair do Sistema
                </button>
            </div>
        </div>

        <div class="main">

            <div class="titulo-sensor">
                <h1 id="titulo_lote">Cadastro de Novo Lote de Produção</h1>
            </div>

            <div class="container">

                <div id="bloco_maior">

                    <h3 class="titulo_secao">Informações do Lote</h3>

                    <hr>
                    <div class="quadrado">
                        <div class="grupo_input">
                            <label>Código do Lote</label>
                            <input type="text" id="id_numero_lote" placeholder="XXXLOTE001">
                        </div>

                        <div class="inputs_lado_a_lado">
                            <div class="grupo_input">
                                <label>Data de Fabricação</label>
                                <input type="date" id="id_data_producao">
                            </div>
                            <div class="grupo_input">
                                <label>Data de Validade</label>
                                <input type="date" id="id_data_validade">
                            </div>
                        </div>

                        <div class="grupo_input" class="input">
                            <label>Quantidade de Caixas</label>
                            <input type="text" id="id_quantidade_caixas" placeholder="500">
                        </div>

                        <hr>

                        <div class="container_botao">
                            <button class="button" onclick="cadastrarLote()">Cadastro Novo Lote</button>
                            <button class="cancelar">Cancelar</button>
                        </div>
                    </div>
                </div>
            </div>
    </body>

</html>

<script>

    function cadastrarLote(){
        let codigo = id_numero_lote.value;
        let dataProducao = id_data_producao.value;
        let dataValidade = id_data_validade.value;
        let quantidade_caixas = id_quantidade_caixas.value;
        let id_empresa = sessionStorage.getItem("ID_EMPRESA");

        fetch("/cadastroLote/cadastrarLote", {
            method: "post",
            headers: {
            "Content-Type": "application/json"
        }, 
          body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                codigoServer: codigo,
                dataProducaoServer: dataProducao,
                dataValidadeServer: dataValidade,
                quantidade_caixasServer: quantidade_caixas,
                id_empresaServer : id_empresa
         })
        })
        .then(res => res.text())
        .then(msg => {
            alert("Lote Cadastrado Com sucesso");
        })
        .catch(erro => console.error(erro));
    }
</script>
