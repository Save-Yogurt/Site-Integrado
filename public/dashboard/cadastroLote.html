    </div>

    <div class="main">

        <div class="titulo-sensor">
            <h1 id="titulo_lote">Cadastro de Novo Lote de Produção</h1>
        </div>
        <a class="btn-suporte" href="https://gabrielverasze.atlassian.net/servicedesk/customer/portal/1">
            <img src="https://cdn-icons-png.flaticon.com/512/1028/1028931.png" alt="Suporte">
        </a>
        <div class="container">

            <div id="bloco_maior">

                <h3 class="titulo_secao">Informações do Lote</h3>


                <div class="quadrado">

                    <div class="grupo_input">
                        <label>Código do Lote</label>
                        <input type="text" id="id_numero_lote" placeholder="Ex: LOT123">
                    </div>

                    <div class="inputs_lado_a_lado">
                        <div class="grupo_input">
                            <label>Data de Fabricação</label>
                            <input type="date" id="id_data_producao">
                        </div>

                        <div class="grupo_input">
                            <label>Data de Validade</label>
                            <input type="date" id="id_data_validade">
                        </div>
                    </div>
                </div>
                <div class="grupo_input">
                    <label>Quantidade de Caixas</label>
                    <input type="text" id="id_quantidade_caixas" placeholder="Ex: 500">
                </div>


                <div class="container_botao">
                    <button type="button" class="button" onclick="cadastrarLote()">
                        Cadastro Novo Lote
                    </button>

                    <button type="button" class="cancelar" onclick="limparCampos()">
                        Cancelar
                    </button>
                </div>

            </div>

        </div>

    </div>

    </div>
    </div>
    </div>



</body>

<script>

    function cadastrarLote() {
        let codigo = document.getElementById("id_numero_lote").value.trim();
        let dataProducao = document.getElementById("id_data_producao").value;
        let dataValidade = document.getElementById("id_data_validade").value;
        let quantidade_caixas = document.getElementById("id_quantidade_caixas").value.trim();
        let id_empresa = sessionStorage.getItem("ID_EMPRESA");

        if (
            codigo == "" ||
            dataProducao == "" ||
            dataValidade == "" ||
            quantidade_caixas == ""
        ) {
            alert("Preencha todos os campos antes de cadastrar o lote.");
            return false;
        }

        fetch("/cadastroLote/cadastrarLote", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                codigoServer: codigo,
                dataProducaoServer: dataProducao,
                dataValidadeServer: dataValidade,
                quantidade_caixasServer: quantidade_caixas,
                id_empresaServer: id_empresa
            })
        })
            .then(function (res) {
                return res.text();
            })
            .then(function (msg) {
                alert("Lote cadastrado com sucesso!");
                limparCampos();
            })
            .catch(function (erro) {
                console.error(erro);
                alert("Erro ao cadastrar lote.");
            });

        return false;
    }

    function limparCampos() {
        document.getElementById("id_numero_lote").value = "";
        document.getElementById("id_data_producao").value = "";
        document.getElementById("id_data_validade").value = "";
        document.getElementById("id_quantidade_caixas").value = "";
    }
</script>
