<script>
    function salvar_atualizacao() {

        var codigoCargaVar = document.getElementById("id_codigo_carga").value.trim();
        var novaLocalizacaoVar = document.getElementById("id_nova_localizacao").value.trim();
        var statusVar = document.getElementById("status").value;

        if (
            codigoCargaVar == "" ||
            novaLocalizacaoVar == "" ||
            statusVar == ""
        ) {
            alert("Preencha todos os campos antes de salvar a atualização.");
            return false;
        }

        console.log("Campos preenchidos corretamente.");
        console.log("FORM CÓDIGO CARGA: ", codigoCargaVar);
        console.log("FORM NOVA LOCALIZAÇÃO: ", novaLocalizacaoVar);
        console.log("FORM STATUS: ", statusVar);

        fetch("/statusCarga/atualizar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                codigoCargaServer: codigoCargaVar,
                novaLocalizacaoServer: novaLocalizacaoVar,
                statusServer: statusVar
            })
        }).then(function (resposta) {

            console.log("ESTOU NO THEN DO salvar_atualizacao()!");

            if (resposta.ok) {
                console.log(resposta);

                alert("Atualização da carga salva com sucesso!");

                limparCampos();

            } else {
                console.log("Houve um erro ao tentar atualizar a carga!");

                resposta.text().then(function (texto) {
                    console.error(texto);
                    alert(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
            alert("Erro de conexão com o servidor.");
        });

        return false;
    }

    function limparCampos() {
        document.getElementById("id_codigo_carga").value = "";
        document.getElementById("id_nova_localizacao").value = "";
        document.getElementById("status").value = "Em_transito";
    }

    function cancelar() {
        limparCampos();
    }

    function limparSessao() {
        window.location.href = "index.html";
    }
</script>
