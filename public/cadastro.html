<script>

    // Array para armazenar empresas cadastradas para validação de código de ativação 
    let listaEmpresasCadastradas = [];

    function cadastrar() {
        // aguardar();

        //Recupere o valor da nova input pelo nome do id
        // Agora vá para o método fetch logo abaixo
        var idEmpresaVincular;
        var nomeVar = ipt_nome_cadastro.value;
        var codigoVar = ipt_codigo_cadastro.value;
        var cpfVar = ipt_cpf_cadastro.value;
        var emailVar = ipt_email_cadastro.value;
        var senhaVar = ipt_senha_cadastro.value;
        var confirmacaoSenhaVar = ipt_confirmar_senha_cadastro.value;

        // Verificando se há algum campo em branco
        if (
            nomeVar == "" ||
            emailVar == "" ||
            senhaVar == "" ||
            cpfVar == "" ||
            confirmacaoSenhaVar == "" ||
            codigoVar == ""
        ) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "(Mensagem de erro para todos os campos em branco)";

            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (nomeVar.length < 3) {

            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "Seu nome deve ter mais de 3 letras";
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (emailVar.includes('@') == false) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "(O email deve conter @.)";

            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (senhaVar.length < 6) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "(Sua senha deve ter mais de 6 caracteres)";

            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (cpfVar.length != 11) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "(O cpf deve ter exatamente 11 caracteres)";

            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (senhaVar != confirmacaoSenhaVar) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "(As senhas não conhecidem)";

            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        // Verificando se o código de ativação é de alguma empresa cadastrada
        for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
            if (listaEmpresasCadastradas[i].token == codigoVar) {
                idEmpresaVincular = listaEmpresasCadastradas[i].id_empresa
                console.log("Código de ativação válido.");
                break;
            } else {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
            }
        }

        console.log("nomeVar:", nomeVar);
        console.log("emailVar:", emailVar);
        console.log("senhaVar:", senhaVar);
        console.log("cpfVar:", cpfVar);
        console.log("codigoVar:", codigoVar);
        console.log("idEmpresaVincular:", idEmpresaVincular);
        console.log("listaEmpresasCadastradas:", listaEmpresasCadastradas);
        // Enviando o valor da nova input
        fetch("/cadastro/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                cpfServer: cpfVar,
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
                idEmpresaVincularServer: idEmpresaVincular
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    cardErro.style.display = "block";

                    mensagem_erro.innerHTML =
                        "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                    setTimeout(() => {
                        window.location = "login.html";
                    }, "2000");

                    limparFormulario();
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }

    // Listando empresas cadastradas 
    function listar() {
        fetch("/cadastro/listar", {
            method: "GET",
        })
            .then(function (resposta) {
                resposta.json().then((empresas) => {
                    empresas.forEach((empresa) => {
                        listaEmpresasCadastradas.push(empresa);

                        console.log("listaEmpresasCadastradas")
                        console.log(listaEmpresasCadastradas[0].token)
                    });
                });
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }
</script>
