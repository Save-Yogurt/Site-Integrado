<script>
    function login() {

        var emailVar = ipt_email_login.value;
        var senhaVar = ipt_senha_login.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/login/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")
            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id_usuario;
                    sessionStorage.ID_EMPRESA = json.id_empresa;
                    cardErro.style.display = "block";

                    cardErro.style.backgroundColor = "#6be48f";
                    cardErro.style.borderColor = "#00ff00";
                    mensagem_erro.style.color = "#000000";

                    mensagem_erro.innerHTML = "Login realizado com sucesso! Redirecionando...";

                    setTimeout(function () {
                        window.location = "./dashboard/dashboardGeral.html";
                    }, 2000); // apenas para exibir o loading
                    // suporte
                    if (emailVar.toLowerCase().includes("suporte")) {
                        setTimeout(function () {
                            window.location = "./dashboard/bobIa.html";
                        }, 2000); // apenas para exibir o loading
                    }
                    // cliente
                    else {
                        setTimeout(function () {
                            window.location = "./dashboard/dashboardGeral.html";
                        }, 2000); // apenas para exibir o loading
                    }

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    cardErro.style.display = "block"
                    mensagem_erro.innerHTML = `${texto}`;
                    return false;
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
